<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Library AI Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; }

    /* Floating button */
    #chat-toggle {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4CAF50, #2196F3);
      color: white;
      font-size: 28px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 9999;
      transition: transform 0.2s;
    }
    #chat-toggle:hover { transform: scale(1.1); }

    /* Chat box */
    #chat-box {
      position: fixed;
      bottom: 100px;
      right: 30px;
      width: 370px;
      height: 500px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
    }
    #chat-box.open { display: flex; }

    /* Header */
    #chat-header {
      background: linear-gradient(135deg, #4CAF50, #2196F3);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #chat-header .avatar {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    #chat-header .info h3 { font-size: 15px; font-weight: 600; }
    #chat-header .info p { font-size: 12px; opacity: 0.85; }
    #chat-header .status {
      width: 8px; height: 8px;
      background: #76ff03;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* Messages area */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f5f7fb;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .msg.bot {
      background: #fff;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .msg.user {
      background: linear-gradient(135deg, #4CAF50, #2196F3);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.typing {
      background: #fff;
      color: #999;
      align-self: flex-start;
      font-style: italic;
    }

    /* Mood chips */
    #mood-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 16px;
      background: #f5f7fb;
      border-top: 1px solid #eee;
    }
    .chip {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      color: #555;
    }
    .chip:hover {
      background: linear-gradient(135deg, #4CAF50, #2196F3);
      color: white;
      border-color: transparent;
    }

    /* Input area */
    #chat-input-area {
      display: flex;
      padding: 12px 16px;
      gap: 8px;
      background: #fff;
      border-top: 1px solid #eee;
    }
    #chat-input {
      flex: 1;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    #chat-input:focus { border-color: #4CAF50; }
    #send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4CAF50, #2196F3);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    #send-btn:hover { transform: scale(1.1); }
  </style>
</head>
<body>

<!-- Floating toggle button -->
<button id="chat-toggle" onclick="toggleChat()">📚</button>

<!-- Chat box -->
<div id="chat-box">
  <!-- Header -->
  <div id="chat-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <h3>Library AI Assistant</h3>
      <p><span class="status"></span>Online — Ask me anything!</p>
    </div>
  </div>

  <!-- Messages -->
  <div id="chat-messages">
    <div class="msg bot">
      Hi! 👋 I'm your AI librarian! Tell me your mood or what kind of book you're looking for and I'll suggest the perfect ones from our library! 📚
    </div>
  </div>

  <!-- Mood quick chips -->
  <div id="mood-chips">
    <span class="chip" onclick="quickSend('I am feeling happy')">😊 Happy</span>
    <span class="chip" onclick="quickSend('I am feeling sad')">😢 Sad</span>
    <span class="chip" onclick="quickSend('I want adventure')">🏔️ Adventure</span>
    <span class="chip" onclick="quickSend('I want romance')">💕 Romance</span>
    <span class="chip" onclick="quickSend('I want something scary')">😱 Scary</span>
    <span class="chip" onclick="quickSend('I want to learn something new')">🧠 Learn</span>
  </div>

  <!-- Input -->
  <div id="chat-input-area">
    <input
      type="text"
      id="chat-input"
      placeholder="Tell me your mood or ask for a book..."
      onkeypress="if(event.key==='Enter') sendMessage()"
    />
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  function toggleChat() {
    const box = document.getElementById('chat-box');
    box.classList.toggle('open');
  }

  function quickSend(text) {
    document.getElementById('chat-input').value = text;
    sendMessage();
  }

  function addMessage(text, type) {
    const messages = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.innerHTML = text.replace(/\n/g, '<br>');
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    // Show user message
    addMessage(message, 'user');
    input.value = '';

    // Show typing indicator
    const typing = addMessage('✍️ Thinking...', 'typing');

    try {
      const response = await fetch('http://localhost:3000/api/ai/suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });

      const data = await response.json();
      typing.remove();

      if (data.reply) {
        addMessage(data.reply, 'bot');
      } else {
        addMessage('Sorry, I could not get a response. Try again!', 'bot');
      }
    } catch (err) {
      typing.remove();
      addMessage('❌ Could not connect to server. Make sure it is running!', 'bot');
    }
  }
</script>

</body>
</html>
